name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the hook tests
        run: python -m unittest discover -s claude-code -p 'test_*.py' -v

  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # sf CLI 2.148+ needs Node 22, and the PMD engine needs Java.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer@latest
      - name: Run the rule tests against the fixtures
        run: python -m unittest discover -s code-analyzer-rules/test -p 'test_*.py' -v
