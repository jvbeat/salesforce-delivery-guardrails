# Code Analyzer configuration used by the workflow (copy it to .github/code-analyzer-ci.yml).
# Third-party code bundled in the project stays out of the scan, so the violation
# count reflects the team's own code.
ignores:
  files:
    - "**/staticresources/**/*.min.js"
    - "**/staticresources/**/*.min.css"

# Declared access mode rules (see the README). Copy code-analyzer-rules/declared-access-mode.xml
# to config/code-analyzer-rules/ in the project and uncomment the block below. Keep the path
# relative to the repository root: in CI the plugin hands it to PMD without resolving it from
# this file's folder.
# engines:
#   pmd:
#     custom_rulesets:
#       - "config/code-analyzer-rules/declared-access-mode.xml"
