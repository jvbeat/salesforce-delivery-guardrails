name: Salesforce Code Analyzer

on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - ".github/workflows/code-analyzer.yml"
      - ".github/code-analyzer-ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Code Analyzer v5 engines have their own prerequisites: node for all of
      # them, java for pmd and cpd, python for flowtest. sf CLI 2.148+ declares
      # engines.node >=22; on Node 20 the undici bundled in jsforce breaks on
      # markAsUncloneable and the CLI does not start.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If the project's eslint.config.js requires 'eslint/config', the Code
      # Analyzer eslint engine loads that file. Without the devDependencies the
      # engine fails with UninstantiableEngineError, which counts as Critical and
      # fails the gate for an environmental reason.
      - name: Install project dependencies (eslint and plugins)
        if: hashFiles('package.json') != ''
        run: npm install --no-audit --no-fund

      - name: Install sf CLI and the code-analyzer plugin
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer@latest
          # code-analyzer is a topic, not a command: "sf code-analyzer --version"
          # exits with 127. sf plugins confirms the plugin is installed.
          sf plugins | grep code-analyzer

      - name: Run Code Analyzer
        id: analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --config-file .github/code-analyzer-ci.yml --workspace force-app --view detail --output-file sfca_results.json --output-file sfca_results.html
          results-artifact-name: code-analyzer-results
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fails on Critical in any file and on new High in the files the PR changed.
      # Old debt does not block delivery, and new code does not ship with a serious violation.
      - name: Severity gate
        run: |
          echo "Total: ${{ steps.analyzer.outputs.num-violations }} violations"
          echo "  Critical: ${{ steps.analyzer.outputs.num-sev1-violations }}"
          echo "  High:     ${{ steps.analyzer.outputs.num-sev2-violations }}"

          CRITICAL="${{ steps.analyzer.outputs.num-sev1-violations }}"
          if [ -n "$CRITICAL" ] && [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical violation found. Fix it before merging."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NEW_HIGH="${{ steps.analyzer.outputs.num-sev2-violations-in-changed-files }}"
            echo "  High in changed files: $NEW_HIGH"
            if [ -n "$NEW_HIGH" ] && [ "$NEW_HIGH" -gt 0 ]; then
              echo "::error::High violation in a file changed by this PR. Fix it or justify it."
              exit 1
            fi
          fi

          echo "No Critical and no new High. Passing."
